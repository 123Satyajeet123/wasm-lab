<!doctype html><meta charset=utf-8><style>*{box-sizing:border-box}html,body{margin:0;padding:0}body{font:16px/1.5 Arial,sans-serif;color:#16202a;background:#fff;padding:20px}.rel{position:relative;height:200px;background:#dce7ea;margin-bottom:16px}.abs{position:absolute;background:#0e6e6e;color:#fff;padding:8px}.tl{top:10px;left:10px}.br{bottom:10px;right:10px}.ctr{top:50%;left:50%}.off{position:relative;top:14px;left:30px;background:#f0c98a;padding:8px;width:160px}</style><div class=rel><div class='abs tl'>top left</div><div class='abs br'>bottom right</div><div class='abs ctr'>50/50</div></div><div class=off>relative offset</div>
